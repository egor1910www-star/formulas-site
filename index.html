<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 QuizMaster · Яркая версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Inter', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #4158D0, #C850C0, #FFCC70);
            min-height: 100vh;
            padding: 20px;
            animation: gradientBG 10s ease infinite;
            background-size: 300% 300%;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 60px;
            padding: 20px 35px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #FF8C00, #FF1493);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }

        .user-area {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nick-input {
            background: rgba(255,255,255,0.25);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50px;
            padding: 14px 28px;
            color: white;
            font-size: 1.1rem;
            min-width: 250px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .nick-input::placeholder {
            color: rgba(255,255,255,0.8);
            font-weight: 400;
        }

        .nick-input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 25px #FFD700;
            background: rgba(255,255,255,0.35);
        }

        .btn {
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            color: #2d1b0a;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255,215,0,0.5);
        }

        .btn-outline {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(5px);
            border: 2px solid white;
            color: white;
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-3px);
        }

        .profile-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            padding: 25px 35px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .profile-info {
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .profile-score {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.8rem;
            color: #2d1b0a;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 35px 0;
        }

        .topic-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 40px;
            padding: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .topic-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(255,255,255,0.3);
            border-color: #FFD700;
            box-shadow: 0 25px 40px rgba(255,215,0,0.3);
        }

        .topic-card.selected {
            border: 3px solid #FFD700;
            background: rgba(255,255,255,0.3);
            box-shadow: 0 0 40px #FFD700;
        }

        .topic-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

        .topic-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .topic-count {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .quiz-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 60px;
            padding: 45px;
            margin: 35px 0;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 35px;
            line-height: 1.4;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50px;
            padding: 22px;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .option-btn:hover {
            background: rgba(255,255,255,0.4);
            border-color: #FFD700;
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(255,215,0,0.4);
        }

        .option-btn.selected {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            border-color: white;
            color: #2d1b0a;
            font-weight: 800;
            box-shadow: 0 0 30px #FFD700;
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #00C853, #69F0AE);
            border-color: white;
            color: #1b5e20;
        }

        .option-btn.wrong {
            background: linear-gradient(135deg, #D50000, #FF5252);
            border-color: white;
            color: white;
        }

        .continue-btn {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            color: #2d1b0a;
            border: none;
            padding: 18px 45px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
            margin-top: 20px;
            width: fit-content;
        }

        .continue-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 35px rgba(255,215,0,0.5);
        }

        .continue-btn.hidden {
            display: none;
        }

        .rating-modal {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            padding: 35px;
            margin-top: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .rating-title {
            color: white;
            font-size: 2rem;
            margin-bottom: 25px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .rating-table {
            width: 100%;
            border-collapse: collapse;
        }

        .rating-table th {
            text-align: left;
            padding: 15px;
            color: #FFD700;
            font-weight: 700;
            font-size: 1.2rem;
            border-bottom: 2px solid rgba(255,215,0,0.5);
        }

        .rating-table td {
            padding: 15px;
            color: white;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .admin-modal {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            padding: 35px;
            margin-top: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .admin-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .admin-tab {
            background: rgba(255,255,255,0.25);
            border: 2px solid rgba(255,255,255,0.4);
            padding: 14px 30px;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.3s;
        }

        .admin-tab.active {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            border-color: white;
            color: #2d1b0a;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            color: white;
        }

        .admin-table th {
            text-align: left;
            padding: 15px;
            background: rgba(255,255,255,0.15);
            font-weight: 700;
            border-radius: 30px 30px 0 0;
        }

        .admin-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            background: linear-gradient(145deg, #4158D0, #C850C0);
            padding: 45px;
            border-radius: 60px;
            width: 450px;
            max-width: 90%;
            border: 3px solid rgba(255,255,255,0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .modal-box h2 {
            color: white;
            margin-bottom: 25px;
            font-size: 2rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .modal-box input {
            width: 100%;
            padding: 18px;
            margin: 15px 0;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 1.1rem;
        }

        .modal-box input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .modal-box input:focus {
            outline: none;
            border-color: #FFD700;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="logo" id="logo">🎯 QuizMaster</div>
            <div class="user-area">
                <input type="text" class="nick-input" id="nickInput" placeholder="Введите имя">
                <button class="btn btn-primary" id="setNickBtn">▶ Играть</button>
                <button class="btn btn-outline" id="showRatingBtn">🏆 Рейтинг</button>
            </div>
        </div>

        <!-- Профиль -->
        <div id="profileArea" style="display: none;">
            <div class="profile-card">
                <div class="profile-info">
                    Игрок: <span id="profileUsername"></span>
                </div>
                <div class="profile-score" id="profileScore">0</div>
            </div>
        </div>

        <div class="topics-grid" id="topicsGrid"></div>

        <div id="quizArea" style="display: none;">
            <div class="quiz-card">
                <div class="question-text" id="questionText"></div>
                <div class="options-grid" id="optionsContainer"></div>
                <button class="continue-btn hidden" id="continueBtn">▶ Продолжить</button>
            </div>
        </div>

        <div id="ratingArea" style="display: none;" class="rating-modal">
            <h2 class="rating-title">🏆 Лучшие игроки</h2>
            <table class="rating-table" id="ratingTable"></table>
        </div>

        <div id="adminArea" style="display: none;" class="admin-modal">
            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="users">👥 Игроки</button>
                <button class="admin-tab" data-tab="answers">📊 Ответы</button>
                <button class="admin-tab" id="closeAdminBtn">✕ Закрыть</button>
            </div>
            <div id="adminContent"></div>
        </div>
    </div>

    <!-- Модалка админского входа -->
    <div class="modal" id="adminLoginModal">
        <div class="modal-box">
            <h2 style="color: white; margin-bottom: 20px;">🔐 Вход администратора</h2>
            <input type="text" id="adminLogin" placeholder="Логин">
            <input type="password" id="adminPass" placeholder="Пароль">
            <button class="btn btn-primary" id="adminLoginBtn" style="width: 100%;">Войти</button>
        </div>
    </div>

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            // ========== ПЕРЕМЕШИВАНИЕ ОТВЕТОВ В ВОПРОСЕ ==========
            function shuffleOptions(question) {
                const options = [...question.options];
                const correctValue = options[question.correct - 1];
                
                const shuffled = shuffleArray([...options]);
                const newCorrectIndex = shuffled.indexOf(correctValue) + 1;
                
                return {
                    ...question,
                    options: shuffled,
                    correct: newCorrectIndex
                };
            }
