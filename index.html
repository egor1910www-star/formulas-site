<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Школьный квиз · Рейтинг + Админка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f0f4fa;
            color: #1a2b4c;
        }
        /* визуализация пути данных */
        .data-path {
            background: #0b1a2f;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            border-radius: 50px;
            margin: 15px 20px;
            border: 2px solid #3b82f6;
        }
        .path-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }
        .node-icon { font-size: 2rem; filter: drop-shadow(0 0 8px #3b82f6); }
        .node-label { font-size: 0.7rem; background: #1e3a5f; padding: 4px 12px; border-radius: 30px; border: 1px solid #3b82f6; }
        .path-arrow { font-size: 2rem; color: #3b82f6; }
        .path-status { background: #132b4a; padding: 6px 20px; border-radius: 40px; color: #a5d8ff; font-size: 0.9rem; }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 30px;
            border-radius: 60px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px #cdd9f0;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4361ee, #b5179e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }
        .user-panel {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .username-input {
            padding: 10px 20px;
            border-radius: 40px;
            border: 2px solid #b3c7f0;
            font-size: 1rem;
        }
        .btn {
            background: #4361ee;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 4px 0 #1e2f5a;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .btn-outline {
            background: white;
            color: #1e2f5a;
            border: 2px solid #4361ee;
            box-shadow: none;
        }

        /* выбор темы */
        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
            gap: 15px;
            margin: 30px 0;
        }
        .topic-card {
            background: white;
            border-radius: 30px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .topic-card:hover {
            border-color: #4361ee;
            transform: scale(1.02);
            box-shadow: 0 10px 20px #a5b9da;
        }
        .topic-card.selected {
            border-color: #b5179e;
            background: #f3e8ff;
        }

        /* игра */
        .quiz-box {
            background: white;
            border-radius: 40px;
            padding: 30px;
            margin: 20px 0;
        }
        .question-text {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 25px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
            gap: 15px;
        }
        .option-btn {
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            padding: 20px;
            border-radius: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #dbeafe;
            border-color: #4361ee;
        }
        .option-btn.selected {
            background: #4361ee;
            color: white;
            border-color: #1e2f5a;
        }
        .option-btn.correct {
            background: #22c55e;
            color: white;
        }
        .option-btn.wrong {
            background: #ef4444;
            color: white;
        }

        /* рейтинг */
        .rating-table {
            background: white;
            border-radius: 40px;
            padding: 20px;
            width: 100%;
            border-collapse: collapse;
        }
        .rating-table th {
            background: #1e2f5a;
            color: white;
            padding: 15px;
        }
        .rating-table td {
            padding: 12px;
            border-bottom: 1px solid #d0dfff;
        }

        /* админка */
        .admin-section {
            background: #e9effa;
            border-radius: 50px;
            padding: 30px;
            margin-top: 40px;
            border: 4px solid #f72585;
            display: none;
        }
        .admin-section.visible {
            display: block;
        }
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .admin-tab {
            background: #1e2f5a;
            color: white;
            padding: 12px 25px;
            border-radius: 40px;
            cursor: pointer;
        }
        .admin-table {
            width: 100%;
            background: white;
            border-radius: 30px;
            border-collapse: collapse;
        }
        .admin-table th {
            background: #1e2f5a;
            color: white;
            padding: 12px;
        }
        .admin-table td {
            padding: 10px;
            border-bottom: 1px solid #d0dfff;
        }
        .admin-btn {
            background: #f72585;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 30px;
            cursor: pointer;
        }

        /* логин админа */
        .admin-login-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .admin-login-box {
            background: white;
            padding: 40px;
            border-radius: 60px;
            width: 400px;
        }
    </style>
</head>
<body>
    <!-- визуализация пути -->
    <div class="data-path" id="dataPath">
        <div class="path-node"><span class="node-icon">📱</span><span class="node-label">Клиент</span></div>
        <span class="path-arrow">→</span>
        <div class="path-node"><span class="node-icon">🌐</span><span class="node-label">Интернет</span></div>
        <span class="path-arrow">→</span>
        <div class="path-node"><span class="node-icon">⚙️</span><span class="node-label">Сервер</span></div>
        <span class="path-arrow">→</span>
        <div class="path-node"><span class="node-icon">🗄️</span><span class="node-label">БД</span></div>
        <div class="path-status" id="pathStatus">⏳ Ожидание</div>
    </div>

    <div class="main-container">
        <!-- шапка с юзером -->
        <div class="header">
            <div class="logo" id="logo">🎓 Квиз · Рейтинг</div>
            <div class="user-panel" id="userPanel">
                <input type="text" id="usernameInput" class="username-input" placeholder="Твой ник">
                <button class="btn" id="loginBtn">Войти</button>
                <button class="btn-outline" id="showRatingBtn">Рейтинг</button>
            </div>
        </div>

        <!-- выбор темы -->
        <h2>📚 Выбери тему</h2>
        <div class="topics-grid" id="topicsGrid"></div>

        <!-- игра -->
        <div id="quizArea" style="display: none;">
            <div class="quiz-box">
                <div class="question-text" id="questionText"></div>
                <div class="options-grid" id="optionsContainer"></div>
            </div>
        </div>

        <!-- рейтинг (всплывает) -->
        <div id="ratingModal" style="display: none; background: white; border-radius: 40px; padding: 20px; margin-top: 20px;">
            <h3>🏆 Рейтинг игроков</h3>
            <table class="rating-table" id="ratingTable"></table>
        </div>

        <!-- админ панель (скрыта) -->
        <div class="admin-section" id="adminPanel">
            <h2>🔐 Админка</h2>
            <div class="admin-tabs">
                <button class="admin-tab" data-tab="users">👥 Игроки</button>
                <button class="admin-tab" data-tab="questions">📋 Вопросы</button>
                <button class="admin-tab" data-tab="answers">📊 Ответы</button>
                <button class="admin-tab" id="closeAdminBtn">❌ Закрыть</button>
            </div>
            <div id="adminContent"></div>
        </div>
    </div>

    <!-- модалка входа админа -->
    <div class="admin-login-modal" id="adminLoginModal">
        <div class="admin-login-box">
            <h3>🔐 Вход администратора</h3>
            <input type="text" id="adminLogin" placeholder="Логин" value="admin" style="width:100%; margin:10px 0; padding:15px; border-radius:30px;">
            <input type="password" id="adminPassword" placeholder="Пароль" style="width:100%; margin:10px 0; padding:15px; border-radius:30px;">
            <button class="btn" id="adminLoginBtn" style="width:100%">Войти</button>
        </div>
    </div>

    <script>
        (function() {
            // ========== КОНФИГ ==========
            const API_TOPICS = 'https://69b7f28dffbcd0286096b93a.mockapi.io/topics';
            const API_DATA = 'https://69b7f28dffbcd0286096b93a.mockapi.io/data';
            const ADMIN_LOGIN = 'admin';
            const ADMIN_PASS = 'admin123';

            // ========== СОСТОЯНИЕ ==========
            let currentUser = null; // { id, username }
            let topics = [];
            let currentTopic = null;
            let currentQuestions = [];
            let currentQuestionIndex = 0;
            let selectedOption = null;
            let isAdmin = false;

            // ========== ВИЗУАЛИЗАЦИЯ ПУТИ ==========
            function setPathStage(stage, details = '') {
                const stages = ['client','internet','server','db'];
                const idx = stages.indexOf(stage);
                document.querySelectorAll('.path-node').forEach((n,i) => {
                    n.style.opacity = i <= idx ? '1' : '0.5';
                });
                const status = {
                    client:'📱 запрос', internet:'🌐 передача', server:'⚙️ обработка', db:'🗄️ ' + details
                }[stage] || '⏳';
                document.getElementById('pathStatus').innerText = status;
            }

            // ========== ЗАГРУЗКА ТЕМ ==========
            async function loadTopics() {
                setPathStage('client');
                setTimeout(()=>setPathStage('internet'),300);
                setTimeout(()=>setPathStage('server'),600);
                try {
                    const res = await fetch(API_TOPICS);
                    topics = await res.json();
                    setPathStage('db','SELECT topics');
                    setTimeout(()=>setPathStage('client','готово'),400);
                    renderTopics();
                } catch(e) {
                    alert('Ошибка загрузки тем');
                }
            }

            function renderTopics() {
                const grid = document.getElementById('topicsGrid');
                grid.innerHTML = topics.map(t => `
                    <div class="topic-card" data-id="${t.id}">
                        <h3>${t.name}</h3>
                        <p>${t.subject} · ${t.grade} класс</p>
                    </div>
                `).join('');
                document.querySelectorAll('.topic-card').forEach(card => {
                    card.addEventListener('click', () => {
                        document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        currentTopic = topics.find(t => t.id == card.dataset.id);
                        loadQuestionsForTopic(currentTopic.id);
                    });
                });
            }

            // ========== ЗАГРУЗКА ВОПРОСОВ ==========
            async function loadQuestionsForTopic(topicId) {
                setPathStage('client');
                setTimeout(()=>setPathStage('internet'),300);
                setTimeout(()=>setPathStage('server'),600);
                try {
                    const res = await fetch(API_DATA);
                    const all = await res.json();
                    currentQuestions = all.filter(item => item.type === 'question' && item.topicId == topicId);
                    setPathStage('db',`${currentQuestions.length} вопросов`);
                    setTimeout(()=>setPathStage('client','готово'),400);
                    
                    if(currentQuestions.length > 0) {
                        currentQuestionIndex = 0;
                        showQuestion();
                        document.getElementById('quizArea').style.display = 'block';
                    } else {
                        document.getElementById('quizArea').style.display = 'none';
                        alert('В этой теме пока нет вопросов');
                    }
                } catch(e) {
                    alert('Ошибка загрузки вопросов');
                }
            }

            function showQuestion() {
                const q = currentQuestions[currentQuestionIndex];
                document.getElementById('questionText').innerText = q.text;
                let options = [];
                try { options = JSON.parse(q.options); } catch { options = ['1','2','3','4']; }
                let html = '';
                options.forEach((opt,idx) => {
                    html += `<button class="option-btn" data-opt="${idx+1}">${opt}</button>`;
                });
                document.getElementById('optionsContainer').innerHTML = html;
                selectedOption = null;
                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.classList.remove('selected','correct','wrong');
                    btn.addEventListener('click', (e) => {
                        if(selectedOption) return;
                        const opt = parseInt(btn.dataset.opt);
                        selectedOption = opt;
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        checkAnswer(q, opt);
                    });
                });
            }

            async function checkAnswer(q, selected) {
                const correct = (selected == q.correct);
                document.querySelectorAll('.option-btn').forEach(btn => {
                    if(btn.dataset.opt == q.correct) btn.classList.add('correct');
                    else if(btn.dataset.opt == selected && !correct) btn.classList.add('wrong');
                });

                if(currentUser) {
                    // сохраняем ответ
                    const answer = {
                        type: 'answer',
                        userId: currentUser.id,
                        username: currentUser.username,
                        questionId: q.id,
                        topicId: q.topicId,
                        correct: correct,
                        points: correct ? 10 : 0,
                        answeredAt: new Date().toISOString()
                    };
                    setPathStage('client');
                    setTimeout(()=>setPathStage('internet'),300);
                    setTimeout(()=>setPathStage('server'),600);
                    setTimeout(()=>setPathStage('db','INSERT answer'),900);
                    await fetch(API_DATA, {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify(answer)
                    });

                    // обновляем очки пользователя
                    if(correct) {
                        const userRes = await fetch(`${API_DATA}?type=user&username=${currentUser.username}`);
                        const users = await userRes.json();
                        if(users.length > 0) {
                            const user = users[0];
                            user.score = (user.score || 0) + 10;
                            await fetch(`${API_DATA}/${user.id}`, {
                                method: 'PUT',
                                headers: {'Content-Type':'application/json'},
                                body: JSON.stringify(user)
                            });
                            currentUser.score = user.score;
                        }
                    }
                }

                setTimeout(() => {
                    if(currentQuestionIndex < currentQuestions.length-1) {
                        currentQuestionIndex++;
                        showQuestion();
                    } else {
                        alert('Тема пройдена!');
                        document.getElementById('quizArea').style.display = 'none';
                    }
                }, 1500);
            }

            // ========== РЕГИСТРАЦИЯ ИГРОКА ==========
            document.getElementById('loginBtn').addEventListener('click', async () => {
                const username = document.getElementById('usernameInput').value.trim();
                if(!username) return alert('Введи ник');
                setPathStage('client');
                setTimeout(()=>setPathStage('internet'),300);
                setTimeout(()=>setPathStage('server'),600);
                const res = await fetch(`${API_DATA}?type=user&username=${username}`);
                const users = await res.json();
                if(users.length > 0) {
                    currentUser = users[0];
                } else {
                    const newUser = {
                        type: 'user',
                        username: username,
                        score: 0,
                        createdAt: new Date().toISOString()
                    };
                    const createRes = await fetch(API_DATA, {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify(newUser)
                    });
                    currentUser = await createRes.json();
                }
                setPathStage('db','user saved');
                setTimeout(()=>setPathStage('client','ok'),400);
                alert(`Привет, ${currentUser.username}!`);
            });

            // ========== РЕЙТИНГ ==========
            document.getElementById('showRatingBtn').addEventListener('click', async () => {
                setPathStage('client');
                setTimeout(()=>setPathStage('internet'),300);
                setTimeout(()=>setPathStage('server'),600);
                const res = await fetch(`${API_DATA}?type=user`);
                const users = await res.json();
                setPathStage('db','SELECT users');
                setTimeout(()=>setPathStage('client','готово'),400);
                users.sort((a,b) => (b.score||0) - (a.score||0));
                let html = '<tr><th>Игрок</th><th>Очки</th></tr>';
                users.forEach(u => {
                    html += `<tr><td>${u.username}</td><td>${u.score || 0}</td></tr>`;
                });
                document.getElementById('ratingTable').innerHTML = html;
                const modal = document.getElementById('ratingModal');
                modal.style.display = 'block';
            });

            // ========== АДМИНКА (СЕКРЕТНЫЙ ВХОД ПО ЛОГОТИПУ) ==========
            let adminClickCount = 0;
            document.getElementById('logo').addEventListener('click', () => {
                adminClickCount++;
                if(adminClickCount >= 5) {
                    document.getElementById('adminLoginModal').style.display = 'flex';
                    adminClickCount = 0;
                }
                setTimeout(() => adminClickCount = 0, 3000);
            });

            document.getElementById('adminLoginBtn').addEventListener('click', async () => {
                const login = document.getElementById('adminLogin').value;
                const pass = document.getElementById('adminPassword').value;
                if(login === ADMIN_LOGIN && pass === ADMIN_PASS) {
                    isAdmin = true;
                    document.getElementById('adminLoginModal').style.display = 'none';
                    document.getElementById('adminPanel').classList.add('visible');
                    loadAdminData('users');
                } else {
                    alert('Неверный логин/пароль');
                }
            });

            async function loadAdminData(tab) {
                setPathStage('client');
                setTimeout(()=>setPathStage('internet'),300);
                setTimeout(()=>setPathStage('server'),600);
                const res = await fetch(API_DATA);
                const all = await res.json();
                setPathStage('db',`${all.length} записей`);
                setTimeout(()=>setPathStage('client','админ'),400);

                let content = '';
                if(tab === 'users') {
                    const users = all.filter(d => d.type === 'user');
                    content = '<table class="admin-table"><tr><th>ID</th><th>Имя</th><th>Очки</th><th>Дата</th></tr>';
                    users.forEach(u => {
                        content += `<tr><td>${u.id}</td><td>${u.username}</td><td>${u.score||0}</td><td>${u.createdAt||''}</td></tr>`;
                    });
                    content += '</table>';
                } else if(tab === 'questions') {
                    const questions = all.filter(d => d.type === 'question');
                    content = '<table class="admin-table"><tr><th>ID</th><th>Тема</th><th>Вопрос</th><th>Ответ</th></tr>';
                    questions.forEach(q => {
                        content += `<tr><td>${q.id}</td><td>${q.topicId}</td><td>${q.text}</td><td>${q.correct}</td></tr>`;
                    });
                    content += '</table>';
                } else if(tab === 'answers') {
                    const answers = all.filter(d => d.type === 'answer');
                    content = '<table class="admin-table"><tr><th>Игрок</th><th>Вопрос</th><th>Верно</th><th>Очки</th></tr>';
                    answers.forEach(a => {
                        content += `<tr><td>${a.username}</td><td>${a.questionId}</td><td>${a.correct}</td><td>${a.points}</td></tr>`;
                    });
                    content += '</table>';
                }
                document.getElementById('adminContent').innerHTML = content;
            }

            document.querySelectorAll('.admin-tab').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const tab = e.target.dataset.tab;
                    if(tab) loadAdminData(tab);
                });
            });
            document.getElementById('closeAdminBtn').addEventListener('click', () => {
                document.getElementById('adminPanel').classList.remove('visible');
            });

            // ========== СТАРТ ==========
            loadTopics();
        })();
    </script>
</body>
</html>
