<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 QuizMaster · Регистрация + Профиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 60px;
            padding: 16px 28px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .user-area {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
        }

        .btn-outline:hover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
        }

        /* Модалки */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 40px;
            width: 450px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-box h2 {
            color: white;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        .modal-box input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #334155;
            border-radius: 30px;
            background: #0f172a;
            color: white;
            font-size: 1rem;
        }

        .modal-box input:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        .modal-box .btn {
            width: 100%;
            margin-top: 20px;
        }

        .modal-link {
            color: #a78bfa;
            text-align: center;
            margin-top: 15px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .modal-link:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }

        /* Профиль */
        .profile-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 30px;
            margin: 20px 0;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
        }

        .profile-info {
            color: white;
        }

        .profile-info h3 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #8b5cf6;
        }

        .stat-label {
            color: #a5b4fc;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .topic-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 25px;
            cursor: pointer;
            transition: 0.25s;
        }

        .topic-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.1);
            border-color: #8b5cf6;
        }

        .topic-card.selected {
            border: 2px solid #8b5cf6;
            background: rgba(139, 92, 246, 0.15);
        }

        .topic-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .topic-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .topic-count {
            color: #a5b4fc;
            font-size: 0.9rem;
        }

        .quiz-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 35px;
            margin: 30px 0;
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: 600;
            color: white;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .option-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            padding: 20px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }

        .option-btn:hover {
            background: rgba(139, 92, 246, 0.3);
            border-color: #8b5cf6;
        }

        .option-btn.selected {
            background: #8b5cf6;
            border-color: white;
        }

        .option-btn.correct {
            background: #10b981;
            border-color: white;
        }

        .option-btn.wrong {
            background: #ef4444;
            border-color: white;
        }

        .rating-modal {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 25px;
            margin-top: 20px;
        }

        .rating-title {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .rating-table {
            width: 100%;
            border-collapse: collapse;
        }

        .rating-table th {
            text-align: left;
            padding: 15px;
            color: #a5b4fc;
            font-weight: 500;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .rating-table td {
            padding: 12px 15px;
            color: white;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .admin-modal {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 30px;
            margin-top: 30px;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .admin-tab {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: 500;

            background: #8b5cf6;
        }

            width: 100%;
            border-collapse: collapse;
            color: white;
        }

        .admin-table th {
            text-align: left;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            font-weight: 500;
        }

            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>

            </div>
            <div id="forgotForm" style="display: none;">

            </div>
        </div>
    </div>

        // ========== API ФУНКЦИИ ==========
        async function loadUsers() {
            try {
                const res = await fetch(`${API_DATA}?type=user`);
                return await res.json();
            } catch(e) {
                console.error('Ошибка загрузки пользователей:', e);
                return [];
            }
        }

        async function loadAnswers() {
            try {
                const res = await fetch(`${API_DATA}?type=answer`);
                return await res.json();
            } catch(e) {
                console.error('Ошибка загрузки ответов:', e);
                return [];
            }
        }

        async function saveUser(user) {
            try {
                const res = await fetch(API_DATA, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(user)
                });
                return await res.json();
            } catch(e) {
                console.error('Ошибка сохранения пользователя:', e);
                return null;
            }
        }

        async function updateUser(userId, data) {
            try {
                await fetch(`${API_DATA}/${userId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
            } catch(e) {
                console.error('Ошибка обновления пользователя:', e);
            }
        }

        async function saveAnswer(answer) {
            try {
                await fetch(API_DATA, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(answer)
                });
            } catch(e) {
                console.error('Ошибка сохранения ответа:', e);
            }
        }

        // ========== АВТОРИЗАЦИЯ ==========
        const authModal = document.getElementById('authModal');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const forgotForm = document.getElementById('forgotForm');

        document.getElementById('showLoginBtn').addEventListener('click', () => {
            authModal.classList.add('active');
            showLoginForm();
        });

        document.getElementById('showRegisterLink').addEventListener('click', () => {
            showRegisterForm();
        });

        document.getElementById('showLoginLink').addEventListener('click', () => {
            showLoginForm();
        });

        document.getElementById('showForgotLink').addEventListener('click', () => {
            showForgotForm();
        });

        document.getElementById('showLoginFromForgot').addEventListener('click', () => {
            showLoginForm();
        });

        function showLoginForm() {
            document.getElementById('authModalTitle').textContent = '🔐 Вход';
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
            forgotForm.style.display = 'none';
        }

        function showRegisterForm() {
            document.getElementById('authModalTitle').textContent = '📝 Регистрация';
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            forgotForm.style.display = 'none';
        }

        function showForgotForm() {
            document.getElementById('authModalTitle').textContent = '📧 Восстановление пароля';
            loginForm.style.display = 'none';
            registerForm.style.display = 'none';
            forgotForm.style.display = 'block';
        }

        // Регистрация
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const password2 = document.getElementById('regPassword2').value;

            if(!username || !email || !password) {
                document.getElementById('regError').textContent = 'Заполни все поля';
                document.getElementById('regError').style.display = 'block';
                return;
            }

            if(password !== password2) {
                document.getElementById('regError').textContent = 'Пароли не совпадают';
                document.getElementById('regError').style.display = 'block';
                return;
            }

            const users = await loadUsers();
            if(users.find(u => u.username === username)) {
                document.getElementById('regError').textContent = 'Логин уже занят';
                document.getElementById('regError').style.display = 'block';
                return;
            }

            const newUser = {
                type: 'user',
                username: username,
                email: email,
                password: password,
                score: 0,
                gamesPlayed: 0,
                registered: new Date().toISOString()
            };

            const savedUser = await saveUser(newUser);
            if(savedUser) {
                currentUser = savedUser;
                authModal.classList.remove('active');
                updateProfile();
                
                // Сохраняем в localStorage для автовхода
                localStorage.setItem('currentUser', JSON.stringify(savedUser));
            }
        });

        // Вход
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            const users = await loadUsers();
            const user = users.find(u => u.username === username && u.password === password);

            if(user) {
                currentUser = user;
                authModal.classList.remove('active');
                updateProfile();
                
                // Сохраняем в localStorage
                localStorage.setItem('currentUser', JSON.stringify(user));
                
                // Очищаем поля ввода
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
                document.getElementById('loginError').style.display = 'none';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });

        // Выход
        document.getElementById('logoutBtn').addEventListener('click', () => {
            currentUser = null;
            document.getElementById('profileArea').style.display = 'none';
            document.getElementById('quizArea').style.display = 'none';
            localStorage.removeItem('currentUser');
        });

        function updateProfile() {
            if(currentUser) {
                document.getElementById('profileArea').style.display = 'block';
                document.getElementById('profileUsername').textContent = currentUser.username;
                document.getElementById('profileEmail').textContent = currentUser.email || '';
                document.getElementById('profileScore').textContent = currentUser.score || 0;
                
                // Считаем пройденные темы (уникальные topicId в ответах)
                loadAnswers().then(answers => {
                    const userAnswers = answers.filter(a => a.userId === currentUser.id);
                    const uniqueTopics = new Set(userAnswers.map(a => a.topicId));
                    document.getElementById('profileGames').textContent = uniqueTopics.size;
                });
            }
        }

        // Проверяем сохранённую сессию при загрузке
        (async function checkSavedSession() {
            const savedUser = localStorage.getItem('currentUser');
            if(savedUser) {
                try {
                    const userData = JSON.parse(savedUser);
                    // Проверяем, что пользователь всё ещё существует в БД
                    const users = await loadUsers();
                    const exists = users.find(u => u.id === userData.id);
                    if(exists) {
                        currentUser = exists;
                        updateProfile();
                    } else {
                        localStorage.removeItem('currentUser');
                    }
                } catch(e) {
                    localStorage.removeItem('currentUser');
                }
            }
        })();

        // ========== ТЕМЫ ==========
        function renderTopics() {
            const grid = document.getElementById('topicsGrid');
            grid.innerHTML = topics.map(t => `
                <div class="topic-card" data-id="${t.id}">
                    <div class="topic-icon">${t.icon}</div>
                    <div class="topic-name">${t.name}</div>
                    <div class="topic-count">${t.count} вопросов</div>
                </div>
            `).join('');

            document.querySelectorAll('.topic-card').forEach(card => {
                card.addEventListener('click', () => {
                    if(!currentUser) {
                        alert('Сначала войди или зарегистрируйся');
                        return;
                    }
                    document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    const id = parseInt(card.dataset.id);
                    currentTopic = topics.find(t => t.id === id);
                    currentQuestions = questionsDB[id] || [];
                    currentQuestionIndex = 0;
                    if(currentQuestions.length > 0) {
                        showQuestion();
                        document.getElementById('quizArea').style.display = 'block';
                    }
                });
            });
        }

        function showQuestion() {
            const q = currentQuestions[currentQuestionIndex];
            document.getElementById('questionText').innerText = q.text;
            let html = '';
            q.options.forEach((opt, idx) => {
                html += `<button class="option-btn" data-opt="${idx+1}">${opt}</button>`;
            });
            document.getElementById('optionsContainer').innerHTML = html;
            selectedOption = null;
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected', 'correct', 'wrong');
                btn.addEventListener('click', (e) => {
                    if(selectedOption) return;
                    const opt = parseInt(btn.dataset.opt);
                    selectedOption = opt;
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    checkAnswer(q, opt);
                });
            });
        }

        async function checkAnswer(q, selected) {
            const correct = (selected === q.correct);
            document.querySelectorAll('.option-btn').forEach(btn => {
                if(btn.dataset.opt == q.correct) btn.classList.add('correct');
                else if(btn.dataset.opt == selected && !correct) btn.classList.add('wrong');
            });

            if(currentUser) {
                const answer = {
                    type: 'answer',
                    userId: currentUser.id,
                    username: currentUser.username,
                    topicId: currentTopic.id,
                    questionText: q.text,
                    correct: correct,
                    points: correct ? 10 : 0,
                    timestamp: new Date().toISOString()
                };
                await saveAnswer(answer);
                
                if(correct) {
                    currentUser.score = (currentUser.score || 0) + 10;
                    await updateUser(currentUser.id, currentUser);
                    document.getElementById('profileScore').textContent = currentUser.score;
                    
                    // Обновляем localStorage
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                }
            }

            setTimeout(() => {
                if(currentQuestionIndex < currentQuestions.length - 1) {
                    currentQuestionIndex++;
                    showQuestion();
                } else {
                    alert('Тема пройдена! Твой счёт: ' + (currentUser?.score || 0));
                    document.getElementById('quizArea').style.display = 'none';
                }
            }, 1500);
        }

        // ========== РЕЙТИНГ ==========
        document.getElementById('showRatingBtn').addEventListener('click', async () => {
            const users = await loadUsers();
            const sorted = [...users].sort((a,b) => (b.score || 0) - (a.score || 0));
            let html = '<tr><th>Игрок</th><th>Очки</th></tr>';
            sorted.forEach(u => {
                html += `<tr><td>${u.username}</td><td>${u.score || 0}</td></tr>`;
            });
            document.getElementById('ratingTable').innerHTML = html;
            document.getElementById('ratingArea').style.display = 'block';
        });

        // ========== АДМИНКА ==========
        let clickCount = 0;
        document.getElementById('logo').addEventListener('click', () => {
            clickCount++;
            if(clickCount >= 5) {
                document.getElementById('adminLoginModal').classList.add('active');
                clickCount = 0;
            }
            setTimeout(() => clickCount = 0, 3000);
        });

        document.getElementById('adminLoginBtn').addEventListener('click', () => {
            const login = document.getElementById('adminLogin').value;
            const pass = document.getElementById('adminPass').value;
            if(login === ADMIN_LOGIN && pass === ADMIN_PASS) {
                document.getElementById('adminLoginModal').classList.remove('active');
                document.getElementById('adminArea').style.display = 'block';
                showAdminUsers();
            } else {
                alert('Неверный логин/пароль');
            }
        });

        async function showAdminUsers() {
            const users = await loadUsers();
            let html = '<table class="admin-table"><tr><th>ID</th><th>Логин</th><th>Email</th><th>Очки</th><th>Дата</th></tr>';
            users.forEach(u => {
                html += `<tr><td>${u.id}</td><td>${u.username}</td><td>${u.email || '-'}</td><td>${u.score || 0}</td><td>${new Date(u.registered).toLocaleString() || ''}</td></tr>`;
            });
            html += '</table>';
            document.getElementById('adminContent').innerHTML = html;
        }

        document.querySelectorAll('.admin-tab').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                if(e.target.dataset.tab === 'users') {
                    await showAdminUsers();
                } else if(e.target.dataset.tab === 'answers') {
                    const answers = await loadAnswers();
                    let html = '<table class="admin-table"><tr><th>Игрок</th><th>Вопрос</th><th>Верно</th><th>Очки</th><th>Время</th></tr>';
                    answers.forEach(a => {
                        html += `<tr><td>${a.username}</td><td>${a.questionText?.substring(0,30)}...</td><td>${a.correct ? '✅' : '❌'}</td><td>${a.points}</td><td>${new Date(a.timestamp).toLocaleString()}</td></tr>`;
                    });
                    html += '</table>';
                    document.getElementById('adminContent').innerHTML = html;
                }
            });
        });

        document.getElementById('closeAdminBtn').addEventListener('click', () => {
            document.getElementById('adminArea').style.display = 'none';
        });

        // Закрытие модалок по клику вне
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if(e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });

        // ========== СТАРТ ==========
        renderTopics();
    })();
</script>
</body>
</html>
