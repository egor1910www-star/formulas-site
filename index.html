<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Шпаргалка: все формулы 5–11 класс (Математика + Физика)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f0f4fa;
            color: #1a2b4c;
        }

        .top-bar {
            background: #ffffff;
            padding: 15px 30px;
            box-shadow: 0 5px 20px rgba(0,20,50,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 3px solid #4361ee;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4361ee, #b5179e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .admin-toggle {
            background: #1e2f5a;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 0 #0b1a2f;
        }

        .admin-toggle:hover {
            background: #2a3f72;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #0b1a2f;
        }

        .admin-panel-badge {
            background: #f72585;
            color: white;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            margin-left: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px 30px;
        }

        /* Визуализация пути данных */
        .data-path {
            background: #0b1a2f;
            padding: 25px 30px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            border-radius: 60px;
            margin-bottom: 30px;
            border: 2px solid #3b82f6;
        }
        .path-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }
        .node-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px #3b82f6);
        }
        .node-label {
            font-size: 0.9rem;
            background: #1e3a5f;
            padding: 5px 15px;
            border-radius: 40px;
            margin-top: 8px;
            border: 1px solid #3b82f6;
        }
        .path-arrow {
            font-size: 2.5rem;
            color: #3b82f6;
            font-weight: 300;
        }
        .path-status {
            background: #132b4a;
            padding: 8px 25px;
            border-radius: 50px;
            color: #a5d8ff;
            font-size: 1rem;
            border: 1px dashed #60a5fa;
            margin-top: 10px;
            width: 100%;
            text-align: center;
        }

        .nav-sections {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .subject-tabs {
            display: flex;
            gap: 10px;
            background: white;
            padding: 8px;
            border-radius: 60px;
            box-shadow: 0 5px 15px #cdd9f0;
        }

        .subject-btn {
            border: none;
            background: transparent;
            padding: 12px 32px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            color: #334e7c;
            transition: 0.2s;
        }

        .subject-btn.active {
            background: #4361ee;
            color: white;
            box-shadow: 0 4px 0 #162b6e;
        }

        .grade-filter {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            background: white;
            padding: 8px 18px;
            border-radius: 50px;
            align-items: center;
            box-shadow: 0 5px 15px #cdd9f0;
        }

        .grade-btn {
            border: none;
            background: #e9edf5;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            color: #1f3a6b;
        }

        .grade-btn.active {
            background: #b5179e;
            color: white;
            box-shadow: 0 3px 0 #641a5c;
        }

        .formula-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .formula-card {
            background: white;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(60, 80, 120, 0.15);
            border-left: 8px solid #4361ee;
            transition: 0.2s;
        }

        .formula-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 30px #96abdf;
        }

        .formula-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1f3a6b;
            margin-bottom: 8px;
        }

        .formula-meta {
            display: flex;
            gap: 15px;
            color: #6c7fa0;
            font-size: 0.9rem;
            margin-bottom: 15px;
            border-bottom: 1px dashed #bbc9e0;
            padding-bottom: 8px;
        }

        .formula-content {
            font-size: 1.3rem;
            background: #f3f7ff;
            padding: 15px;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #022b49;
            text-align: center;
            overflow-x: auto;
        }

        .formula-desc {
            margin-top: 12px;
            color: #3c4f70;
        }

        .admin-section {
            background: #e9effa;
            border-radius: 50px;
            padding: 30px;
            margin-top: 40px;
            border: 4px solid #f72585;
            display: none;
        }

        .admin-section.visible {
            display: block;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .admin-header h2 {
            color: #b5179e;
            font-size: 2rem;
        }

        .admin-table {
            width: 100%;
            background: white;
            border-radius: 30px;
            border-collapse: collapse;
            overflow: hidden;
            box-shadow: 0 10px 20px #a5b9da;
        }

        .admin-table th {
            background: #1e2f5a;
            color: white;
            padding: 15px;
            font-weight: 600;
        }

        .admin-table td {
            padding: 15px;
            border-bottom: 1px solid #d0dfff;
        }

        .admin-table tr:hover {
            background: #f1f7ff;
        }

        .admin-btn {
            background: #f72585;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            margin: 2px;
        }

        .add-form {
            background: white;
            padding: 25px;
            border-radius: 40px;
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
            gap: 15px;
        }

        .add-form input, .add-form select, .add-form textarea {
            padding: 15px;
            border-radius: 30px;
            border: 2px solid #b3c7f0;
            font-size: 1rem;
        }

        .save-btn {
            background: #4361ee;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            grid-column: span 2;
        }

        .db-view {
            background: #0b1a2f;
            color: #b7efff;
            padding: 25px;
            border-radius: 40px;
            font-family: monospace;
            white-space: pre-wrap;
            margin-top: 25px;
            max-height: 400px;
            overflow: auto;
        }

        .status-message {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #64748b;
        }

        @media (max-width: 700px) {
            .subject-tabs { flex-wrap: wrap; }
            .add-form { grid-template-columns: 1fr; }
            .save-btn { grid-column: span 1; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo">📘 Формуляриум · 5–11 класс</div>
        <div>
            <button class="admin-toggle" id="adminToggleBtn">🔐 Вход для администратора</button>
            <span class="admin-panel-badge" id="adminBadge" style="display: none;">Admin ON</span>
        </div>
    </div>

    <div class="container">
        <!-- Визуализация пути данных -->
        <div class="data-path" id="dataPath">
            <div class="path-node">
                <span class="node-icon">📱</span>
                <span class="node-label">Клиент</span>
            </div>
            <span class="path-arrow">→</span>
            <div class="path-node">
                <span class="node-icon">🌐</span>
                <span class="node-label">Интернет</span>
            </div>
            <span class="path-arrow">→</span>
            <div class="path-node">
                <span class="node-icon">⚙️</span>
                <span class="node-label">Сервер</span>
            </div>
            <span class="path-arrow">→</span>
            <div class="path-node">
                <span class="node-icon">🗄️</span>
                <span class="node-label">База данных</span>
            </div>
            <div class="path-status" id="pathStatus">⏳ Загрузка формул...</div>
        </div>

        <div class="nav-sections">
            <div class="subject-tabs" id="subjectTabs">
                <button class="subject-btn active" data-subject="math">📐 Математика</button>
                <button class="subject-btn" data-subject="physics">⚡ Физика</button>
            </div>
            <div class="grade-filter" id="gradeFilter">
                <button class="grade-btn active" data-grade="all">Все</button>
                <button class="grade-btn" data-grade="5">5</button>
                <button class="grade-btn" data-grade="6">6</button>
                <button class="grade-btn" data-grade="7">7</button>
                <button class="grade-btn" data-grade="8">8</button>
                <button class="grade-btn" data-grade="9">9</button>
                <button class="grade-btn" data-grade="10">10</button>
                <button class="grade-btn" data-grade="11">11</button>
            </div>
        </div>

        <div id="formulaGrid" class="formula-grid">
            <div class="status-message">Загрузка формул из облачной базы данных...</div>
        </div>

        <div id="adminPanel" class="admin-section">
            <div class="admin-header">
                <h2>⚙️ Панель управления формулами</h2>
                <button class="admin-btn" id="hideAdminBtn">Скрыть</button>
            </div>

            <div class="add-form" id="addForm">
                <input type="text" id="newTitle" placeholder="Название (теорема Пифагора)" required>
                <select id="newSubject">
                    <option value="math">Математика</option>
                    <option value="physics">Физика</option>
                </select>
                <input type="number" id="newGrade" placeholder="Класс (5-11)" min="5" max="11" required>
                <input type="text" id="newFormula" placeholder="a² + b² = c²" required>
                <textarea id="newDesc" placeholder="Краткое описание / пояснение"></textarea>
                <button class="save-btn" id="addFormulaBtn">➕ Добавить формулу в облако</button>
            </div>

            <table class="admin-table" id="adminTable">
                <thead>
                    <tr><th>ID</th><th>Название</th><th>Предмет</th><th>Класс</th><th>Формула</th><th>Действия</th></tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>

            <div class="db-view" id="dbRawView"></div>
        </div>
    </div>

    <script>
        (function() {
            // ========== ТВОЯ ССЫЛКА НА БАЗУ ==========
            const API_URL = 'https://69b7f28dffbcd0286096b93a.mockapi.io/questions';
            
            // ========== СОСТОЯНИЕ ==========
            let formulasDB = [];
            let currentSubject = 'math';
            let currentGrade = 'all';
            let adminVisible = false;

            // ========== ВИЗУАЛИЗАЦИЯ ПУТИ ==========
            function setPathStage(stage, details = '') {
                const stages = ['client', 'internet', 'server', 'db'];
                const index = stages.indexOf(stage);
                const nodes = document.querySelectorAll('.path-node');
                nodes.forEach((node, i) => {
                    if (i <= index) {
                        node.style.opacity = '1';
                        node.style.filter = 'drop-shadow(0 0 10px #3b82f6)';
                    } else {
                        node.style.opacity = '0.5';
                        node.style.filter = 'none';
                    }
                });
                let statusText = '';
                if (stage === 'client') statusText = '📱 Браузер → запрос';
                else if (stage === 'internet') statusText = '🌐 Пакеты в пути';
                else if (stage === 'server') statusText = '⚙️ Сервер обрабатывает';
                else if (stage === 'db') statusText = '🗄️ БД: ' + (details || 'выполнение запроса');
                document.getElementById('pathStatus').innerText = statusText;
            }

            // ========== ЗАГРУЗКА ИЗ БАЗЫ ==========
            async function loadFormulas() {
                setPathStage('client');
                setTimeout(() => setPathStage('internet'), 400);
                setTimeout(() => setPathStage('server'), 800);
                
                try {
                    const response = await fetch(API_URL);
                    if (!response.ok) throw new Error('Ошибка загрузки');
                    formulasDB = await response.json();
                    
                    setPathStage('db', `SELECT ${formulasDB.length} записей`);
                    setTimeout(() => setPathStage('client', 'Данные получены'), 500);
                    
                    renderFormulaGrid();
                    renderAdminTable();
                } catch (error) {
                    console.error('Ошибка:', error);
                    document.getElementById('formulaGrid').innerHTML = 
                        '<div class="status-message">❌ Ошибка загрузки данных. Проверь ссылку API.</div>';
                    setPathStage('client', 'Ошибка соединения');
                }
            }

            // ========== СОХРАНЕНИЕ (POST) ==========
            async function addFormulaToDB(formula) {
                setPathStage('client');
                setTimeout(() => setPathStage('internet'), 300);
                setTimeout(() => setPathStage('server'), 600);
                
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(formula)
                    });
                    const newFormula = await response.json();
                    formulasDB.push(newFormula);
                    
                    setPathStage('db', 'INSERT INTO questions');
                    setTimeout(() => {
                        setPathStage('client', 'Формула добавлена');
                        renderFormulaGrid();
                        renderAdminTable();
                    }, 500);
                } catch (error) {
                    alert('Ошибка при добавлении');
                }
            }

            // ========== УДАЛЕНИЕ ==========
            async function deleteFormulaFromDB(id) {
                if (!confirm('Удалить формулу?')) return;
                
                setPathStage('client');
                setTimeout(() => setPathStage('internet'), 300);
                setTimeout(() => setPathStage('server'), 600);
                
                try {
                    await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    formulasDB = formulasDB.filter(f => f.id != id);
                    
                    setPathStage('db', 'DELETE FROM questions');
                    setTimeout(() => {
                        setPathStage('client', 'Формула удалена');
                        renderFormulaGrid();
                        renderAdminTable();
                    }, 500);
                } catch (error) {
                    alert('Ошибка при удалении');
                }
            }

            // ========== РЕДАКТИРОВАНИЕ ==========
            async function editFormulaInDB(id, newData) {
                setPathStage('client');
                setTimeout(() => setPathStage('internet'), 300);
                setTimeout(() => setPathStage('server'), 600);
                
                try {
                    await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(newData)
                    });
                    
                    const index = formulasDB.findIndex(f => f.id == id);
                    formulasDB[index] = { ...formulasDB[index], ...newData };
                    
                    setPathStage('db', 'UPDATE questions');
                    setTimeout(() => {
                        setPathStage('client', 'Формула обновлена');
                        renderFormulaGrid();
                        renderAdminTable();
                    }, 500);
                } catch (error) {
                    alert('Ошибка при редактировании');
                }
            }

            // ========== ОТРИСОВКА КАРТОЧЕК ==========
            function renderFormulaGrid() {
                const grid = document.getElementById('formulaGrid');
                
                if (formulasDB.length === 0) {
                    grid.innerHTML = '<div class="status-message">📭 База данных пуста. Добавь первую формулу в админке!</div>';
                    return;
                }

                const filtered = formulasDB.filter(f => {
                    if (f.subject !== currentSubject) return false;
                    if (currentGrade !== 'all' && f.grade != currentGrade) return false;
                    return true;
                });

                if (filtered.length === 0) {
                    grid.innerHTML = '<div class="status-message">😕 Нет формул для этого фильтра</div>';
                    return;
                }

                let html = '';
                filtered.forEach(f => {
                    html += `
                        <div class="formula-card">
                            <div class="formula-title">${escapeHtml(f.title)}</div>
                            <div class="formula-meta"><span>📚 ${f.subject === 'math' ? 'Математика' : 'Физика'}</span> <span>🔹 ${f.grade} класс</span></div>
                            <div class="formula-content">${escapeHtml(f.formula)}</div>
                            <div class="formula-desc">${escapeHtml(f.desc) || '—'}</div>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            }

            // ========== ОТРИСОВКА АДМИНКИ ==========
            function renderAdminTable() {
                const tbody = document.getElementById('adminTableBody');
                let rows = '';
                formulasDB.forEach(f => {
                    rows += `<tr>
                        <td>${f.id}</td>
                        <td>${escapeHtml(f.title)}</td>
                        <td>${f.subject === 'math' ? '📐 Математика' : '⚡ Физика'}</td>
                        <td>${f.grade}</td>
                        <td>${escapeHtml(f.formula)}</td>
                        <td>
                            <button class="admin-btn" onclick="window.deleteFormula('${f.id}')">🗑️ удалить</button>
                            <button class="admin-btn" onclick="window.editFormula('${f.id}')">✏️ ред.</button>
                        </td>
                    </tr>`;
                });
                tbody.innerHTML = rows;
                document.getElementById('dbRawView').innerText = JSON.stringify(formulasDB, null, 2);
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ========== ГЛОБАЛЬНЫЕ ФУНКЦИИ ==========
            window.deleteFormula = function(id) {
                deleteFormulaFromDB(id);
            };

            window.editFormula = function(id) {
                const f = formulasDB.find(f => f.id == id);
                if (!f) return;
                
                const newTitle = prompt('Название', f.title);
                if (newTitle !== null) f.title = newTitle;
                
                const newFormula = prompt('Формула', f.formula);
                if (newFormula !== null) f.formula = newFormula;
                
                const newDesc = prompt('Описание', f.desc || '');
                if (newDesc !== null) f.desc = newDesc;
                
                editFormulaInDB(id, { title: f.title, formula: f.formula, desc: f.desc });
            };

            // ========== СОБЫТИЯ ==========
            document.getElementById('addFormulaBtn').addEventListener('click', function(e) {
                e.preventDefault();
                
                const title = document.getElementById('newTitle').value.trim();
                const subject = document.getElementById('newSubject').value;
                const grade = parseInt(document.getElementById('newGrade').value);
                const formula = document.getElementById('newFormula').value.trim();
                const desc = document.getElementById('newDesc').value.trim();

                if (!title || !grade || !formula) {
                    alert('Заполни название, класс и формулу');
                    return;
                }

                addFormulaToDB({ title, subject, grade, formula, desc });
                
                document.getElementById('newTitle').value = '';
                document.getElementById('newFormula').value = '';
                document.getElementById('newDesc').value = '';
                document.getElementById('newGrade').value = '';
            });

            document.querySelectorAll('.subject-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSubject = btn.dataset.subject;
                    renderFormulaGrid();
                });
            });

            document.querySelectorAll('.grade-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentGrade = btn.dataset.grade;
                    renderFormulaGrid();
                });
            });

            // Админ панель
            const adminPanel = document.getElementById('adminPanel');
            const adminToggle = document.getElementById('adminToggleBtn');
            const adminBadge = document.getElementById('adminBadge');
            const hideAdminBtn = document.getElementById('hideAdminBtn');

            adminToggle.addEventListener('click', () => {
                adminVisible = !adminVisible;
                adminPanel.classList.toggle('visible', adminVisible);
                adminBadge.style.display = adminVisible ? 'inline-block' : 'none';
                if (adminVisible) renderAdminTable();
            });

            hideAdminBtn.addEventListener('click', () => {
                adminVisible = false;
                adminPanel.classList.remove('visible');
                adminBadge.style.display = 'none';
            });

            // ========== СТАРТ ==========
            loadFormulas();
        })();
    </script>
</body>
</html>
