<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 QuizMaster · Яркая версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Inter', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #4158D0, #C850C0, #FFCC70);
            min-height: 100vh;
            padding: 20px;
            animation: gradientBG 10s ease infinite;
            background-size: 300% 300%;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 60px;
            padding: 20px 35px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #FF8C00, #FF1493);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }

        .user-area {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nick-input {
            background: rgba(255,255,255,0.25);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50px;
            padding: 14px 28px;
            color: white;
            font-size: 1.1rem;
            min-width: 250px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .nick-input::placeholder {
            color: rgba(255,255,255,0.8);
            font-weight: 400;
        }

        .nick-input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 25px #FFD700;
            background: rgba(255,255,255,0.35);
        }

        .btn {
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            color: #2d1b0a;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255,215,0,0.5);
        }

        .btn-outline {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(5px);
            border: 2px solid white;
            color: white;
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-3px);
        }

        .profile-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            padding: 25px 35px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .profile-info {
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .profile-score {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.8rem;
            color: #2d1b0a;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 35px 0;
        }

        .topic-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 40px;
            padding: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .topic-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(255,255,255,0.3);
            border-color: #FFD700;
            box-shadow: 0 25px 40px rgba(255,215,0,0.3);
        }

        .topic-card.selected {
            border: 3px solid #FFD700;
            background: rgba(255,255,255,0.3);
            box-shadow: 0 0 40px #FFD700;
        }

        .topic-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

        .topic-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .topic-count {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .quiz-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 60px;
            padding: 45px;
            margin: 35px 0;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 35px;
            line-height: 1.4;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50px;
            padding: 22px;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .option-btn:hover {
            background: rgba(255,255,255,0.4);
            border-color: #FFD700;
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(255,215,0,0.4);
        }

        .option-btn.selected {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            border-color: white;
            color: #2d1b0a;
            font-weight: 800;
            box-shadow: 0 0 30px #FFD700;
        }

        .continue-btn {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            color: #2d1b0a;
            border: none;
            padding: 18px 45px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
            margin-top: 20px;
            width: fit-content;
        }

        .continue-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 35px rgba(255,215,0,0.5);
        }

        .continue-btn.hidden {
            display: none;
        }

        .rating-modal {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            padding: 35px;
            margin-top: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .rating-title {
            color: white;
            font-size: 2rem;
            margin-bottom: 25px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .rating-table {
            width: 100%;
            border-collapse: collapse;
        }

        .rating-table th {
            text-align: left;
            padding: 15px;
            color: #FFD700;
            font-weight: 700;
            font-size: 1.2rem;
            border-bottom: 2px solid rgba(255,215,0,0.5);
        }

        .rating-table td {
            padding: 15px;
            color: white;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .admin-modal {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            padding: 35px;
            margin-top: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .admin-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .admin-tab {
            background: rgba(255,255,255,0.25);
            border: 2px solid rgba(255,255,255,0.4);
            padding: 14px 30px;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.3s;
        }

        .admin-tab.active {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            border-color: white;
            color: #2d1b0a;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            color: white;
        }

        .admin-table th {
            text-align: left;
            padding: 15px;
            background: rgba(255,255,255,0.15);
            font-weight: 700;
            border-radius: 30px 30px 0 0;
        }

        .admin-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            background: linear-gradient(145deg, #4158D0, #C850C0);
            padding: 45px;
            border-radius: 60px;
            width: 450px;
            max-width: 90%;
            border: 3px solid rgba(255,255,255,0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .modal-box h2 {
            color: white;
            margin-bottom: 25px;
            font-size: 2rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .modal-box input {
            width: 100%;
            padding: 18px;
            margin: 15px 0;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 1.1rem;
        }

        .modal-box input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .modal-box input:focus {
            outline: none;
            border-color: #FFD700;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="logo" id="logo">🎯 QuizMaster</div>
            <div class="user-area">
                <input type="text" class="nick-input" id="nickInput" placeholder="Введите имя">
                <button class="btn btn-primary" id="setNickBtn">▶ Играть</button>
                <button class="btn btn-outline" id="showRatingBtn">🏆 Рейтинг</button>
            </div>
        </div>

        <!-- Профиль -->
        <div id="profileArea" style="display: none;">
            <div class="profile-card">
                <div class="profile-info">
                    Игрок: <span id="profileUsername"></span>
                </div>
                <div class="profile-score" id="profileScore">0</div>
            </div>
        </div>

        <div class="topics-grid" id="topicsGrid"></div>

        <div id="quizArea" style="display: none;">
            <div class="quiz-card">
                <div class="question-text" id="questionText"></div>
                <div class="options-grid" id="optionsContainer"></div>
                <button class="continue-btn hidden" id="continueBtn">▶ Продолжить</button>
            </div>
        </div>

        <div id="ratingArea" style="display: none;" class="rating-modal">
            <h2 class="rating-title">🏆 Лучшие игроки</h2>
            <table class="rating-table" id="ratingTable"></table>
        </div>

        <div id="adminArea" style="display: none;" class="admin-modal">
            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="users">👥 Игроки</button>
                <button class="admin-tab" data-tab="answers">📊 Ответы</button>
                <button class="admin-tab" id="closeAdminBtn">✕ Закрыть</button>
            </div>
            <div id="adminContent"></div>
        </div>
    </div>

<!-- Модалка админского входа -->

        <input type="password" id="adminPass" placeholder="Пароль">

    </div>
</div>

            // ========== ПЕРЕМЕШИВАНИЕ ВОПРОСОВ ==========
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            // ========== ПЕРЕМЕШИВАНИЕ ОТВЕТОВ В ВОПРОСЕ ==========
            function shuffleOptions(question) {
                const options = [...question.options];
                const correctValue = options[question.correct - 1];
                
                const shuffled = shuffleArray([...options]);
                const newCorrectIndex = shuffled.indexOf(correctValue) + 1;
                
                return {
                    ...question,
                    options: shuffled,
                    correct: newCorrectIndex
                };
            }

            // ========== ПОДГОТОВКА ВОПРОСОВ ДЛЯ ТЕМЫ ==========
            function getPreparedQuestions(topicId) {
                let questions = [...questionsDB[topicId]];
                
                // Перемешиваем вопросы
                questions = shuffleArray(questions);
                
                // Перемешиваем ответы в каждом вопросе
                questions = questions.map(q => shuffleOptions(q));
                
                return questions;
            }

            // ========== API ФУНКЦИИ ==========
            async function loadUsers() {
                try {
                    const res = await fetch(`${API_DATA}?type=user`);
                    return await res.json();
                } catch(e) {
                    return [];
                }
            }

            async function loadAnswers() {
                try {
                    const res = await fetch(`${API_DATA}?type=answer`);
                    return await res.json();
                } catch(e) {
                    return [];
                }
            }

            async function saveUser(user) {
                const res = await fetch(API_DATA, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(user)
                });
                return await res.json();
            }

            async function updateUser(userId, data) {
                await fetch(`${API_DATA}/${userId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
            }

            async function saveAnswer(answer) {
                await fetch(API_DATA, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(answer)
                });
            }

            // ========== ВХОД ПО НИКУ ==========
            document.getElementById('setNickBtn').addEventListener('click', async () => {
                const nickname = document.getElementById('nickInput').value.trim();
                if(!nickname) {
                    alert('Введите имя!');
                    return;
                }

                const users = await loadUsers();
                let user = users.find(u => u.username === nickname);

                if(!user) {
                    const newUser = {
                        type: 'user',
                        username: nickname,
                        score: 0,
                        gamesPlayed: 0,
                        registered: new Date().toISOString()
                    };
                    user = await saveUser(newUser);
                }

                currentUser = user;
                document.getElementById('profileArea').style.display = 'block';
                document.getElementById('profileUsername').textContent = user.username;
                document.getElementById('profileScore').textContent = user.score || 0;
                
                updateRating();
            });

            // ========== РЕЙТИНГ ==========
            async function updateRating() {
                const users = await loadUsers();
                const sorted = [...users].sort((a,b) => (b.score || 0) - (a.score || 0));
                let html = '<tr><th>Игрок</th><th>Очки</th></tr>';
                sorted.forEach(u => {
                    html += `<tr><td>${u.username}</td><td>${u.score || 0}</td></tr>`;
                });
                document.getElementById('ratingTable').innerHTML = html;
            }

            document.getElementById('showRatingBtn').addEventListener('click', async () => {
                await updateRating();
                document.getElementById('ratingArea').style.display = 'block';
            });

            // ========== ТЕМЫ ==========
            function renderTopics() {
                const grid = document.getElementById('topicsGrid');
                grid.innerHTML = topics.map(t => `
                    <div class="topic-card" data-id="${t.id}">
                        <div class="topic-icon">${t.icon}</div>
                        <div class="topic-name">${t.name}</div>
                        <div class="topic-count">${t.count} вопросов</div>
                    </div>
                `).join('');

                document.querySelectorAll('.topic-card').forEach(card => {
                    card.addEventListener('click', () => {
                        if(!currentUser) {
                            alert('Сначала введите имя и нажмите "Играть"');
                            return;
                        }
                        document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        const id = parseInt(card.dataset.id);
                        currentTopic = topics.find(t => t.id === id);
                        currentQuestions = getPreparedQuestions(id);
                        currentQuestionIndex = 0;
                        selectedOption = null;
                        answerSelected = false;
                        
                        if(currentQuestions.length > 0) {
                            showQuestion();
                            document.getElementById('quizArea').style.display = 'block';
                        }
                    });
                });
            }

            function showQuestion() {
                const q = currentQuestions[currentQuestionIndex];
                document.getElementById('questionText').innerText = q.text;
                
                let html = '';
                q.options.forEach((opt, idx) => {
                    html += `<button class="option-btn" data-opt="${idx+1}">${opt}</button>`;
                });
                document.getElementById('optionsContainer').innerHTML = html;
                
                selectedOption = null;
                answerSelected = false;
                
                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.classList.remove('selected');
                    btn.addEventListener('click', (e) => {
                        if(answerSelected) return;
                        const opt = parseInt(btn.dataset.opt);
                        selectedOption = opt;
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                    });
                });

                const continueBtn = document.getElementById('continueBtn');
                continueBtn.classList.remove('hidden');
                continueBtn.onclick = () => checkAnswer(q);
            }

            async function checkAnswer(q) {
                if(!selectedOption) {
                    alert('Выберите ответ!');
                    return;
                }

                answerSelected = true;
                const correct = (selectedOption === q.correct);

                // Подсвечиваем правильный и неправильный
                document.querySelectorAll('.option-btn').forEach(btn => {
                    const optVal = parseInt(btn.dataset.opt);
                    if(optVal === q.correct) {
                        btn.classList.add('correct');
                        btn.style.background = 'linear-gradient(135deg, #00C853, #69F0AE)';
                    } else if(optVal === selectedOption && !correct) {
                        btn.classList.add('wrong');
                        btn.style.background = 'linear-gradient(135deg, #D50000, #FF5252)';
                    }
                });

                if(currentUser && correct) {
                    const answer = {
                        type: 'answer',
                        userId: currentUser.id,
                        username: currentUser.username,
                        topicId: currentTopic.id,
                        questionText: q.text,
                        correct: true,
                        points: 10,
                        timestamp: new Date().toISOString()
                    };
                    await saveAnswer(answer);
                    
                    currentUser.score = (currentUser.score || 0) + 10;
                    await updateUser(currentUser.id, currentUser);
                    document.getElementById('profileScore').textContent = currentUser.score;
                    
                    await updateRating();
                }

                // Прячем кнопку продолжения до следующего вопроса
                document.getElementById('continueBtn').classList.add('hidden');
                
                // Автоматически переходим к следующему вопросу через 1.5 секунды
                setTimeout(() => {
                    if(currentQuestionIndex < currentQuestions.length - 1) {
                        currentQuestionIndex++;
                        showQuestion();
                    } else {
                        alert('Тема пройдена! Твой счёт: ' + (currentUser?.score || 0));
                        document.getElementById('quizArea').style.display = 'none';
                    }
                }, 1500);
            }

            let clickCount = 0;
            document.getElementById('logo').addEventListener('click', () => {
                clickCount++;
                if(clickCount >= 5) {
                    document.getElementById('adminLoginModal').classList.add('active');

            async function showAdminUsers() {
                const users = await loadUsers();
                let html = '<table class="admin-table"><tr><th>ID</th><th>Логин</th><th>Очки</th><th>Дата</th></tr>';
                users.forEach(u => {
                    html += `<tr><td>${u.id}</td><td>${u.username}</td><td>${u.score || 0}</td><td>${new Date(u.registered).toLocaleString() || ''}</td></tr>`;
                });
                html += '</table>';
                document.getElementById('adminContent').innerHTML = html;
            }

            document.querySelectorAll('.admin-tab').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    if(e.target.dataset.tab === 'users') {
                        await showAdminUsers();
                    } else if(e.target.dataset.tab === 'answers') {
                        const answers = await loadAnswers();
                        let html = '<table class="admin-table"><tr><th>Игрок</th><th>Вопрос</th><th>Верно</th><th>Очки</th></tr>';
                        answers.forEach(a => {
                            html += `<tr><td>${a.username}</td><td>${a.questionText?.substring(0,30)}...</td><td>${a.correct ? '✅' : '❌'}</td><td>${a.points}</td></tr>`;
                        });
                        html += '</table>';
                        document.getElementById('adminContent').innerHTML = html;
                    }
                });
            });

            document.getElementById('closeAdminBtn').addEventListener('click', () => {
                document.getElementById('adminArea').style.display = 'none';
            });

            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if(e.target === modal) {
                        modal.classList.remove('active');
                    }
                });
            });

            renderTopics();
        })();
