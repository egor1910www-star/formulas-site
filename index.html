<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 QuizMaster · Без паролей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 60px;
            padding: 16px 28px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .user-area {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nick-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 40px;
            padding: 12px 24px;
            color: white;
            font-size: 1rem;
            min-width: 200px;
        }

        .nick-input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .btn {
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
        }

        .btn-outline:hover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
        }

        .profile-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 20px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .profile-info {
            color: white;
            font-size: 1.2rem;
        }

        .profile-score {
            background: #8b5cf6;
            padding: 10px 25px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.5rem;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .topic-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 25px;
            cursor: pointer;
            transition: 0.25s;
        }

        .topic-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.1);
            border-color: #8b5cf6;
        }

        .topic-card.selected {
            border: 2px solid #8b5cf6;
            background: rgba(139, 92, 246, 0.15);
        }

        .topic-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .topic-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .topic-count {
            color: #a5b4fc;
            font-size: 0.9rem;
        }

        .quiz-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 35px;
            margin: 30px 0;
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: 600;
            color: white;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .option-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            padding: 20px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }

        .option-btn:hover {
            background: rgba(139, 92, 246, 0.3);
            border-color: #8b5cf6;
        }

        .option-btn.selected {
            background: #8b5cf6;
            border-color: white;
        }

        .option-btn.correct {
            background: #10b981;
            border-color: white;
        }

        .option-btn.wrong {
            background: #ef4444;
            border-color: white;
        }

        .rating-modal {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 25px;
            margin-top: 20px;
        }

        .rating-title {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .rating-table {
            width: 100%;
            border-collapse: collapse;
        }

        .rating-table th {
            text-align: left;
            padding: 15px;
            color: #a5b4fc;
            font-weight: 500;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .rating-table td {
            padding: 12px 15px;
            color: white;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .admin-modal {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 30px;
            margin-top: 30px;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .admin-tab {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        .admin-tab.active {
            background: #8b5cf6;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            color: white;
        }

        .admin-table th {
            text-align: left;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            font-weight: 500;
        }

        .admin-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 40px;
            width: 400px;
            max-width: 90%;
        }

        .modal-box input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #334155;
            border-radius: 30px;
            background: #0f172a;
            color: white;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="logo" id="logo">🎯 QuizMaster</div>
            <div class="user-area">
                <input type="text" class="nick-input" id="nickInput" placeholder="Твой ник" value="Игрок">
                <button class="btn btn-primary" id="setNickBtn">▶ Играть</button>
                <button class="btn btn-outline" id="showRatingBtn">🏆 Рейтинг</button>
            </div>
        </div>

        <!-- Профиль -->
        <div id="profileArea" style="display: none;">
            <div class="profile-card">
                <div class="profile-info">
                    Игрок: <span id="profileUsername"></span>
                </div>
                <div class="profile-score" id="profileScore">0</div>
            </div>
        </div>

        <div class="topics-grid" id="topicsGrid"></div>

        <div id="quizArea" style="display: none;">
            <div class="quiz-card">
                <div class="question-text" id="questionText"></div>
                <div class="options-grid" id="optionsContainer"></div>
            </div>
        </div>

        <div id="ratingArea" style="display: none;" class="rating-modal">
            <h2 class="rating-title">🏆 Лучшие игроки</h2>
            <table class="rating-table" id="ratingTable"></table>
        </div>

        <div id="adminArea" style="display: none;" class="admin-modal">
            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="users">👥 Игроки</button>
                <button class="admin-tab" data-tab="answers">📊 Ответы</button>
                <button class="admin-tab" id="closeAdminBtn">✕ Закрыть</button>
            </div>
            <div id="adminContent"></div>
        </div>
    </div>

    <!-- Модалка админского входа -->
    <div class="modal" id="adminLoginModal">
        <div class="modal-box">
            <h2 style="color: white; margin-bottom: 20px;">🔐 Вход администратора</h2>
            <input type="text" id="adminLogin" placeholder="Логин" value="admin">
            <input type="password" id="adminPass" placeholder="Пароль" value="admin123">
            <button class="btn btn-primary" id="adminLoginBtn" style="width: 100%;">Войти</button>
        </div>
    </div>

    <script>
        (function() {
            // ========== КОНФИГ ==========
            const API_DATA = 'https://69b7f28dffbcd0286096b93a.mockapi.io/data';
            const ADMIN_LOGIN = 'admin';
            const ADMIN_PASS = 'admin123';

            // ========== СОСТОЯНИЕ ==========
            let currentUser = null;
            let currentTopic = null;
            let currentQuestions = [];
            let currentQuestionIndex = 0;
            let selectedOption = null;
            let isAdmin = false;

            // ========== ТЕМЫ ==========
            const topics = [
                { id: 1, name: '🧮 Математика', icon: '🧮', count: 30 },
                { id: 2, name: '⚡ Физика', icon: '⚡', count: 30 },

                { id: 6, name: '🧬 Биология', icon: '🧬', count: 30 }
            ];

            // ========== ВОПРОСЫ ==========
            const questionsDB = {
                1: [ // Математика
                    { text: 'Сколько будет 2 + 2 × 2?', options: ['6', '8', '4'], correct: 1 },
                    { text: 'Какой корень из 144?', options: ['12', '14', '16'], correct: 1 },
                    { text: 'Число π примерно равно...', options: ['3.14', '3.41', '3.04'], correct: 1 },
                    { text: 'Сколько градусов в прямом угле?', options: ['90°', '180°', '360°'], correct: 1 },
                    { text: 'Что такое 5! (факториал)?', options: ['120', '60', '100'], correct: 1 },
                    { text: 'Сколько сторон у шестиугольника?', options: ['6', '8', '12'], correct: 1 },
                    { text: 'Римская цифра X — это...', options: ['10', '5', '100'], correct: 1 },
                    { text: 'Сколько миллиметров в метре?', options: ['1000', '100', '10'], correct: 1 },
                    { text: 'Как называется треугольник с тремя равными сторонами?', options: ['Равносторонний', 'Равнобедренный', 'Прямоугольный'], correct: 1 },
                    { text: 'Сколько будет 15 - 3 × 2?', options: ['9', '24', '12'], correct: 1 }
                ],
                2: [ // Физика
                    { text: 'В чём измеряется сила тока?', options: ['Амперы', 'Вольты', 'Омы'], correct: 1 },
                    { text: 'Какой газ необходим для дыхания?', options: ['Кислород', 'Азот', 'Углекислый газ'], correct: 1 },
                    { text: 'Что тяжелее: 1 кг железа или 1 кг ваты?', options: ['Одинаково', 'Железо', 'Вата'], correct: 1 },
                    { text: 'Прибор для измерения напряжения?', options: ['Вольтметр', 'Амперметр', 'Омметр'], correct: 1 },
                    { text: 'Какая планета самая большая?', options: ['Юпитер', 'Сатурн', 'Нептун'], correct: 1 },
                    { text: 'Что такое сила тяжести?', options: ['Притяжение Земли', 'Электричество', 'Магнетизм'], correct: 1 },
                    { text: 'В чём измеряется энергия?', options: ['Джоули', 'Ватты', 'Ньютоны'], correct: 1 },
                    { text: 'Сколько цветов в радуге?', options: ['7', '6', '8'], correct: 1 },
                    { text: 'Что быстрее: свет или звук?', options: ['Свет', 'Звук', 'Одинаково'], correct: 1 },
                    { text: 'Температура кипения воды?', options: ['100°C', '90°C', '120°C'], correct: 1 }
                ],
                3: [ // История
                    { text: 'В каком году началась Вторая мировая война?', options: ['1939', '1941', '1914'], correct: 1 },
                    { text: 'Кто был первым президентом США?', options: ['Вашингтон', 'Линкольн', 'Джефферсон'], correct: 1 },
                    { text: 'В каком году полетел Юрий Гагарин?', options: ['1961', '1957', '1965'], correct: 1 },
                    { text: 'Кто написал "Войну и мир"?', options: ['Толстой', 'Достоевский', 'Чехов'], correct: 1 },
                    { text: 'Какая империя пала последней?', options: ['Османская', 'Римская', 'Монгольская'], correct: 1 },
                    { text: 'В каком году распался СССР?', options: ['1991', '1989', '1993'], correct: 1 },
                    { text: 'Кто открыл Америку?', options: ['Колумб', 'Магеллан', 'Васко да Гама'], correct: 1 },
                    { text: 'Какая цивилизация построила пирамиды?', options: ['Египет', 'Майя', 'Рим'], correct: 1 },
                    { text: 'В каком году была Куликовская битва?', options: ['1380', '1240', '1480'], correct: 1 },
                    { text: 'Кто изобрёл книгопечатание?', options: ['Гутенберг', 'Эдисон', 'Попов'], correct: 1 }
                ],
                4: [ // Литература
                    { text: 'Кто написал "Преступление и наказание"?', options: ['Достоевский', 'Толстой', 'Чехов'], correct: 1 },
                    { text: 'Как звали няню Пушкина?', options: ['Арина Родионовна', 'Татьяна', 'Ольга'], correct: 1 },
                    { text: 'Кто написал "Муму"?', options: ['Тургенев', 'Некрасов', 'Гончаров'], correct: 1 },
                    { text: 'Главный герой "Героя нашего времени"?', options: ['Печорин', 'Онегин', 'Базаров'], correct: 1 },
                    { text: 'Кто написал "Войну и мир"?', options: ['Толстой', 'Достоевский', 'Чехов'], correct: 1 },
                    { text: 'Как звали главную героиню "Анны Карениной"?', options: ['Анна', 'Наташа', 'Катерина'], correct: 1 },
                    { text: 'Кто написал "Евгения Онегина"?', options: ['Пушкин', 'Лермонтов', 'Грибоедов'], correct: 1 },
                    { text: 'Что писал Чехов?', options: ['Рассказы и пьесы', 'Романы', 'Поэмы'], correct: 1 },
                    { text: 'Кто автор "Мёртвых душ"?', options: ['Гоголь', 'Салтыков-Щедрин', 'Тургенев'], correct: 1 },
                    { text: 'Где родился Пушкин?', options: ['Москва', 'Петербург', 'Михайловское'], correct: 1 }
                ],
                5: [ // География
                    { text: 'Самая длинная река в мире?', options: ['Амазонка', 'Нил', 'Миссисипи'], correct: 1 },
                    { text: 'Самая высокая гора?', options: ['Эверест', 'Эльбрус', 'Монблан'], correct: 1 },
                    { text: 'Сколько океанов на Земле?', options: ['5', '4', '6'], correct: 1 },
                    { text: 'Самый большой океан?', options: ['Тихий', 'Атлантический', 'Индийский'], correct: 1 },
                    { text: 'Столица Франции?', options: ['Париж', 'Лондон', 'Берлин'], correct: 1 },
                    { text: 'Самая маленькая страна?', options: ['Ватикан', 'Монако', 'Сан-Марино'], correct: 1 },
                    { text: 'Какой континент самый большой?', options: ['Азия', 'Африка', 'Америка'], correct: 1 },
                    { text: 'Какая пустыня самая большая?', options: ['Сахара', 'Гоби', 'Калахари'], correct: 1 },
                    { text: 'Столица Италии?', options: ['Рим', 'Милан', 'Неаполь'], correct: 1 },
                    { text: 'Самое глубокое озеро?', options: ['Байкал', 'Танганьика', 'Виктория'], correct: 1 }
                ],
                6: [ // Биология
                    { text: 'Сколько камер в сердце человека?', options: ['4', '3', '2'], correct: 1 },
                    { text: 'Какая наука изучает растения?', options: ['Ботаника', 'Зоология', 'Анатомия'], correct: 1 },
                    { text: 'Какой орган отвечает за зрение?', options: ['Глаза', 'Уши', 'Нос'], correct: 1 },
                    { text: 'Сколько хромосом у человека?', options: ['46', '48', '44'], correct: 1 },
                    { text: 'Какое животное самое быстрое?', options: ['Гепард', 'Лев', 'Антилопа'], correct: 1 },
                    { text: 'Что такое фотосинтез?', options: ['Питание растений', 'Дыхание', 'Размножение'], correct: 1 },
                    { text: 'Самый большой орган человека?', options: ['Кожа', 'Печень', 'Кишечник'], correct: 1 },
                    { text: 'Сколько зубов у взрослого человека?', options: ['32', '30', '28'], correct: 1 },
                    { text: 'Какая кровь самая редкая?', options: ['Четвертая отрицательная', 'Первая', 'Вторая'], correct: 1 },
                    { text: 'Сколько лет живут слоны?', options: ['~70', '~50', '~90'], correct: 1 }
                ]
            };

            // ========== API ФУНКЦИИ ==========
            async function loadUsers() {
                try {
                    const res = await fetch(`${API_DATA}?type=user`);
                    return await res.json();
                } catch(e) {
                    return [];
                }
            }

            async function loadAnswers() {
                try {
                    const res = await fetch(`${API_DATA}?type=answer`);
                    return await res.json();
                } catch(e) {
                    return [];
                }
            }

            async function saveUser(user) {
                const res = await fetch(API_DATA, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(user)
                });
                return await res.json();
            }

            async function updateUser(userId, data) {
                await fetch(`${API_DATA}/${userId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
            }

            async function saveAnswer(answer) {
                await fetch(API_DATA, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(answer)
                });
            }

            // ========== ВХОД ПО НИКУ ==========
            document.getElementById('setNickBtn').addEventListener('click', async () => {
                const nickname = document.getElementById('nickInput').value.trim();
                if(!nickname) return alert('Введи ник');

                const users = await loadUsers();
                let user = users.find(u => u.username === nickname);

                if(!user) {
                    const newUser = {
                        type: 'user',
                        username: nickname,
                        score: 0,
                        gamesPlayed: 0,
                        registered: new Date().toISOString()
                    };
                    user = await saveUser(newUser);
                }

                currentUser = user;
                document.getElementById('profileArea').style.display = 'block';
                document.getElementById('profileUsername').textContent = user.username;
                document.getElementById('profileScore').textContent = user.score || 0;
                
                // Обновляем рейтинг сразу
                updateRating();
            });

            // ========== РЕЙТИНГ ==========
            async function updateRating() {
                const users = await loadUsers();
                const sorted = [...users].sort((a,b) => (b.score || 0) - (a.score || 0));
                let html = '<tr><th>Игрок</th><th>Очки</th></tr>';
                sorted.forEach(u => {
                    html += `<tr><td>${u.username}</td><td>${u.score || 0}</td></tr>`;
                });
                document.getElementById('ratingTable').innerHTML = html;
            }

            document.getElementById('showRatingBtn').addEventListener('click', async () => {
                await updateRating();
                document.getElementById('ratingArea').style.display = 'block';
            });

            // ========== ТЕМЫ ==========
            function renderTopics() {
                const grid = document.getElementById('topicsGrid');
                grid.innerHTML = topics.map(t => `
                    <div class="topic-card" data-id="${t.id}">
                        <div class="topic-icon">${t.icon}</div>
                        <div class="topic-name">${t.name}</div>
                        <div class="topic-count">${t.count} вопросов</div>
                    </div>
                `).join('');

                document.querySelectorAll('.topic-card').forEach(card => {
                    card.addEventListener('click', () => {
                        if(!currentUser) {
                            alert('Сначала введи ник и нажми "Играть"');
                            return;
                        }
                        document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        const id = parseInt(card.dataset.id);
                        currentTopic = topics.find(t => t.id === id);
                        currentQuestions = questionsDB[id] || [];
                        currentQuestionIndex = 0;
                        if(currentQuestions.length > 0) {
                            showQuestion();
                            document.getElementById('quizArea').style.display = 'block';
                        }
                    });
                });
            }

            function showQuestion() {
                const q = currentQuestions[currentQuestionIndex];
                document.getElementById('questionText').innerText = q.text;
                let html = '';
                q.options.forEach((opt, idx) => {
                    html += `<button class="option-btn" data-opt="${idx+1}">${opt}</button>`;
                });
                document.getElementById('optionsContainer').innerHTML = html;
                selectedOption = null;
                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.classList.remove('selected', 'correct', 'wrong');
                    btn.addEventListener('click', (e) => {
                        if(selectedOption) return;
                        const opt = parseInt(btn.dataset.opt);
                        selectedOption = opt;
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        checkAnswer(q, opt);
                    });
                });
            }

            async function checkAnswer(q, selected) {
                const correct = (selected === q.correct);
                document.querySelectorAll('.option-btn').forEach(btn => {
                    if(btn.dataset.opt == q.correct) btn.classList.add('correct');
                    else if(btn.dataset.opt == selected && !correct) btn.classList.add('wrong');
                });

                if(currentUser) {
                    const answer = {
                        type: 'answer',
                        userId: currentUser.id,
                        username: currentUser.username,
                        topicId: currentTopic.id,
                        questionText: q.text,
                        correct: correct,
                        points: correct ? 10 : 0,
                        timestamp: new Date().toISOString()
                    };
                    await saveAnswer(answer);
                    
                    if(correct) {
                        currentUser.score = (currentUser.score || 0) + 10;
                        await updateUser(currentUser.id, currentUser);
                        document.getElementById('profileScore').textContent = currentUser.score;
                        
                        // Обновляем рейтинг после каждого ответа
                        await updateRating();
                    }
                }

                setTimeout(() => {
                    if(currentQuestionIndex < currentQuestions.length - 1) {
                        currentQuestionIndex++;
                        showQuestion();
                    } else {
                        alert('Тема пройдена! Твой счёт: ' + (currentUser?.score || 0));
                        document.getElementById('quizArea').style.display = 'none';
                    }
                }, 1500);
            }

            // ========== АДМИНКА ==========
            let clickCount = 0;
            document.getElementById('logo').addEventListener('click', () => {
                clickCount++;
                if(clickCount >= 5) {
                    document.getElementById('adminLoginModal').classList.add('active');
                    clickCount = 0;
                }
                setTimeout(() => clickCount = 0, 3000);
            });

            document.getElementById('adminLoginBtn').addEventListener('click', () => {
                const login = document.getElementById('adminLogin').value;
                const pass = document.getElementById('adminPass').value;
                if(login === ADMIN_LOGIN && pass === ADMIN_PASS) {
                    document.getElementById('adminLoginModal').classList.remove('active');
                    document.getElementById('adminArea').style.display = 'block';
                    showAdminUsers();
                } else {
                    alert('Неверный логин/пароль');
                }
            });

            async function showAdminUsers() {
                const users = await loadUsers();
                let html = '<table class="admin-table"><tr><th>ID</th><th>Логин</th><th>Очки</th><th>Дата</th></tr>';
                users.forEach(u => {
                    html += `<tr><td>${u.id}</td><td>${u.username}</td><td>${u.score || 0}</td><td>${new Date(u.registered).toLocaleString() || ''}</td></tr>`;
                });
                html += '</table>';
                document.getElementById('adminContent').innerHTML = html;
            }

            document.querySelectorAll('.admin-tab').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    if(e.target.dataset.tab === 'users') {
                        await showAdminUsers();
                    } else if(e.target.dataset.tab === 'answers') {
                        const answers = await loadAnswers();
                        let html = '<table class="admin-table"><tr><th>Игрок</th><th>Вопрос</th><th>Верно</th><th>Очки</th></tr>';
                        answers.forEach(a => {
                            html += `<tr><td>${a.username}</td><td>${a.questionText?.substring(0,30)}...</td><td>${a.correct ? '✅' : '❌'}</td><td>${a.points}</td></tr>`;
                        });
                        html += '</table>';
                        document.getElementById('adminContent').innerHTML = html;
                    }
                });
            });

            document.getElementById('closeAdminBtn').addEventListener('click', () => {
                document.getElementById('adminArea').style.display = 'none';
            });

            // Закрытие модалок
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if(e.target === modal) {
                        modal.classList.remove('active');
                    }
                });
            });

            // ========== СТАРТ ==========
            renderTopics();
        })();
    </script>
</body>
</html>
