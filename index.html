<html lang="ru">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Шапка */
        .header {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 60px;
            padding: 16px 28px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .user-area {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nick-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 40px;
            padding: 12px 24px;
            color: white;
            font-size: 1rem;
            min-width: 200px;
        }

        .nick-input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .btn {
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
        }

        .btn-outline:hover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
        }

        /* Сетка тем */
        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .topic-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 25px;
            cursor: pointer;
            transition: 0.25s;
        }

        .topic-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.1);
            border-color: #8b5cf6;
        }

        .topic-card.selected {
            border: 2px solid #8b5cf6;
            background: rgba(139, 92, 246, 0.15);
        }

        .topic-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .topic-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .topic-count {
            color: #a5b4fc;
            font-size: 0.9rem;
        }

        /* Карточка вопроса */
        .quiz-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 35px;
            margin: 30px 0;
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: 600;
            color: white;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .option-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            padding: 20px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }

        .option-btn:hover {
            background: rgba(139, 92, 246, 0.3);
            border-color: #8b5cf6;
        }

        .option-btn.selected {
            background: #8b5cf6;
            border-color: white;
        }

        .option-btn.correct {
            background: #10b981;
            border-color: white;
        }

        .option-btn.wrong {
            background: #ef4444;
            border-color: white;
        }

        /* Рейтинг */
        .rating-modal {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 25px;
            margin-top: 20px;
        }

        .rating-title {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .rating-table {
            width: 100%;
            border-collapse: collapse;
        }

        .rating-table th {
            text-align: left;
            padding: 15px;
            color: #a5b4fc;
            font-weight: 500;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .rating-table td {
            padding: 12px 15px;
            color: white;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* Админка */
        .admin-modal {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 30px;
            margin-top: 30px;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .admin-tab {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        .admin-tab.active {
            background: #8b5cf6;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            color: white;
        }

        .admin-table th {
            text-align: left;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            font-weight: 500;
        }

        .admin-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .login-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 40px;
            width: 400px;
            max-width: 90%;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #334155;
            border-radius: 30px;
            background: #0f172a;
            color: white;
        }

</head>

        <!-- Область вопроса (скрыта) -->

            </div>
            <div id="adminContent"></div>
        </div>
    </div>

    <!-- Модалка входа админа -->

            // ========== СОСТОЯНИЕ ==========
            let currentUser = null;
            let currentTopic = null;
            let currentQuestions = [];
            let currentQuestionIndex = 0;
            let selectedOption = null;
            let users = [];
            let answers = [];
            let isAdmin = false;

            // ========== ЗАГРУЗКА ТЕМ ==========
            function renderTopics() {
                const grid = document.getElementById('topicsGrid');
                grid.innerHTML = DB.topics.map(t => `
                    <div class="topic-card" data-id="${t.id}">
                        <div class="topic-icon">${t.icon}</div>
                        <div class="topic-name">${t.name}</div>
                        <div class="topic-count">${t.count} вопросов</div>
                    </div>
                `).join('');

                document.querySelectorAll('.topic-card').forEach(card => {
                    card.addEventListener('click', () => {
                        document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        const id = parseInt(card.dataset.id);
                        currentTopic = DB.topics.find(t => t.id === id);
                        currentQuestions = DB.questions[id] || [];
                        currentQuestionIndex = 0;
                        if(currentQuestions.length > 0) {
                            showQuestion();
                            document.getElementById('quizArea').style.display = 'block';
                        }
                    });
                });
            }

            function showQuestion() {
                const q = currentQuestions[currentQuestionIndex];
                document.getElementById('questionText').innerText = q.text;
                let html = '';
                q.options.forEach((opt, idx) => {
                    html += `<button class="option-btn" data-opt="${idx+1}">${opt}</button>`;
                });
                document.getElementById('optionsContainer').innerHTML = html;
                selectedOption = null;
                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.classList.remove('selected', 'correct', 'wrong');
                    btn.addEventListener('click', (e) => {
                        if(selectedOption) return;
                        const opt = parseInt(btn.dataset.opt);
                        selectedOption = opt;
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        checkAnswer(q, opt);
                    });
                });
            }

            function checkAnswer(q, selected) {
                const correct = (selected === q.correct);
                document.querySelectorAll('.option-btn').forEach(btn => {
                    if(btn.dataset.opt == q.correct) btn.classList.add('correct');
                    else if(btn.dataset.opt == selected && !correct) btn.classList.add('wrong');
                });

                if(currentUser) {
                    const answer = {
                        userId: currentUser.id,
                        username: currentUser.username,
                        topicId: currentTopic.id,
                        correct: correct,
                        points: correct ? 10 : 0,
                        timestamp: new Date().toISOString()
                    };
                    answers.push(answer);
                    
                    if(correct) {
                        currentUser.score = (currentUser.score || 0) + 10;
                        const userIndex = users.findIndex(u => u.id === currentUser.id);
                        if(userIndex >= 0) users[userIndex].score = currentUser.score;
                    }
                }

                setTimeout(() => {
                    if(currentQuestionIndex < currentQuestions.length - 1) {
                        currentQuestionIndex++;
                        showQuestion();
                    } else {
                        alert('Тема пройдена! Твой счёт: ' + (currentUser?.score || 0));
                        document.getElementById('quizArea').style.display = 'none';
                    }
                }, 1500);
            }

            // ========== РЕГИСТРАЦИЯ ==========
            document.getElementById('loginBtn').addEventListener('click', () => {
                const username = document.getElementById('nickInput').value.trim();
                if(!username) return alert('Введи ник');
                
                const existing = users.find(u => u.username === username);
                if(existing) {
                    currentUser = existing;
                } else {
                    currentUser = {
                        id: Date.now().toString(),
                        username: username,
                        score: 0,
                        registered: new Date().toISOString()
                    };
                    users.push(currentUser);
                }
                alert(`Привет, ${currentUser.username}!`);
            });

            // ========== РЕЙТИНГ ==========
            document.getElementById('showRatingBtn').addEventListener('click', () => {
                const sorted = [...users].sort((a,b) => (b.score || 0) - (a.score || 0));
                let html = '<tr><th>Игрок</th><th>Очки</th></tr>';
                sorted.forEach(u => {
                    html += `<tr><td>${u.username}</td><td>${u.score || 0}</td></tr>`;
                });
                document.getElementById('ratingTable').innerHTML = html;
                document.getElementById('ratingArea').style.display = 'block';
            });

            // ========== АДМИНКА (СЕКРЕТНЫЙ ВХОД) ==========
            let clickCount = 0;
            document.getElementById('logo').addEventListener('click', () => {
                clickCount++;
                if(clickCount >= 5) {
                    document.getElementById('adminLoginModal').style.display = 'flex';
                    clickCount = 0;
                }
                setTimeout(() => clickCount = 0, 3000);
            });

            document.getElementById('adminLoginBtn').addEventListener('click', () => {
                const login = document.getElementById('adminLogin').value;
                const pass = document.getElementById('adminPass').value;
                if(login === 'admin' && pass === 'admin123') {
                    isAdmin = true;
                    document.getElementById('adminLoginModal').style.display = 'none';
                    document.getElementById('adminArea').style.display = 'block';
                    showAdminUsers();
                } else {
                    alert('Неверный логин/пароль');
                }
            });

            function showAdminUsers() {
                let html = '<table class="admin-table"><tr><th>Игрок</th><th>Очки</th><th>Дата</th></tr>';
                users.forEach(u => {
                    html += `<tr><td>${u.username}</td><td>${u.score || 0}</td><td>${u.registered || ''}</td></tr>`;
                });
                html += '</table>';
                document.getElementById('adminContent').innerHTML = html;
            }

            document.querySelectorAll('.admin-tab').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    if(e.target.dataset.tab === 'users') showAdminUsers();
                    else if(e.target.dataset.tab === 'answers') {
                        let html = '<table class="admin-table"><tr><th>Игрок</th><th>Тема</th><th>Верно</th><th>Очки</th></tr>';
                        answers.forEach(a => {
                            html += `<tr><td>${a.username}</td><td>${a.topicId}</td><td>${a.correct ? '✅' : '❌'}</td><td>${a.points}</td></tr>`;
                        });
                        html += '</table>';
                        document.getElementById('adminContent').innerHTML = html;
                    }
                });
            });

            document.getElementById('closeAdminBtn').addEventListener('click', () => {
                document.getElementById('adminArea').style.display = 'none';
            });

            // ========== СТАРТ ==========
            renderTopics();
        })();
